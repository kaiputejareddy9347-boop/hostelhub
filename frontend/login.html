<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">🏢 HostelHub</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html" class="btn btn-secondary">Sign Up</a></li>
        </ul>
    </nav>

    <!-- Login Form -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to access your HostelHub portal</p>
            </div>

            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Log In
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await Api.auth.login(username, password);
                alertBox.className = 'alert-box alert-success';
                alertBox.textContent = 'Login successful! Redirecting...';
                alertBox.style.display = 'flex';
                
                setTimeout(() => {
                    if (response.role === 'OWNER') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } catch (err) {
                alertBox.className = 'alert-box alert-danger';
                alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
                alertBox.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
