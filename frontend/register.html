<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">🏢 HostelHub</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="btn btn-secondary">Log In</a></li>
        </ul>
    </nav>

    <!-- Register Form -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join HostelHub to start booking or listing hostels</p>
            </div>

            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role" class="form-control form-select" required>
                        <option value="STUDENT">Student (To search and book)</option>
                        <option value="OWNER">Hostel Owner (To list and manage properties)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Sign Up
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
                Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Log In</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            
            const role = document.getElementById('role').value;
            const name = document.getElementById('name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await Api.auth.register(username, email, password, role, name, phone);
                alertBox.className = 'alert-box alert-success';
                alertBox.textContent = response.message || 'Registration successful! Redirecting to login...';
                alertBox.style.display = 'flex';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                alertBox.className = 'alert-box alert-danger';
                alertBox.textContent = err.message || 'Registration failed. Please check your inputs.';
                alertBox.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
