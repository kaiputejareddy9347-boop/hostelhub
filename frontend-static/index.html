<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - Find your Perfect Home Away from Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">🏢 HostelHub</a>
        <ul class="nav-links" id="navLinks">
            <!-- Dynamically populated -->
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="btn btn-secondary">Log In</a></li>
            <li><a href="register.html" class="btn btn-primary">Sign Up</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section">
        <h1 class="hero-title">Find Your Perfect <br>Home Away From Home</h1>
        <p class="hero-subtitle">Discover premium, student-friendly hostels with high-speed WiFi, security, and top-tier facilities.</p>
        
        <!-- Search -->
        <div class="search-container">
            <div class="search-field" style="border-right: 1px solid var(--border-color); padding-right: 15px;">
                <label for="searchCity">Location / City</label>
                <input type="text" id="searchCity" placeholder="Enter city (e.g. Visakhapatnam)">
            </div>
            <button id="searchBtn" class="btn btn-primary">
                🔍 Search Hostels
            </button>
        </div>
    </header>

    <!-- Hostel Listings Section -->
    <section>
        <h2 class="section-title">✨ Featured Hostels</h2>
        <div class="hostels-grid" id="hostelsGrid">
            <!-- Dynamically populated -->
            <p style="text-align: center; grid-column: 1 / -1; color: var(--text-secondary);">Loading hostels...</p>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script>
        // Update Navbar based on Auth state
        function renderNavbar() {
            const navLinks = document.getElementById('navLinks');
            const user = Api.auth.getCurrentUser();
            
            let links = `<li><a href="index.html">Home</a></li>`;
            
            if (Api.auth.isAuthenticated() && user) {
                if (user.role === 'OWNER') {
                    links += `<li><a href="dashboard.html" class="btn btn-secondary">🛠️ Manage Listings</a></li>`;
                } else {
                    links += `<li><a href="dashboard.html" class="btn btn-secondary">📝 My Bookings</a></li>`;
                }
                links += `<li><span style="color: var(--text-secondary); margin-left: 10px;">Hi, ${user.name}</span></li>`;
                links += `<li><button onclick="Api.auth.logout()" class="btn btn-outline">Log Out</button></li>`;
            } else {
                links += `<li><a href="login.html" class="btn btn-secondary">Log In</a></li>`;
                links += `<li><a href="register.html" class="btn btn-primary">Sign Up</a></li>`;
            }
            
            navLinks.innerHTML = links;
        }

        // Fetch and Render Hostels
        async function fetchHostels(city = '') {
            const hostelsGrid = document.getElementById('hostelsGrid');
            hostelsGrid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: var(--text-secondary);">Searching hostels...</p>';
            
            try {
                const hostels = await Api.hostels.getAll(city);
                
                if (hostels.length === 0) {
                    hostelsGrid.innerHTML = `
                        <div style="text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-secondary);">
                            <p style="font-size: 48px;">🔍</p>
                            <p style="font-size: 18px; margin-top: 10px; font-weight: 600;">No hostels found</p>
                            <p style="font-size: 14px; margin-top: 5px; color: var(--text-muted);">Try searching for another city, or search without filters.</p>
                        </div>
                    `;
                    return;
                }

                hostelsGrid.innerHTML = '';
                hostels.forEach(hostel => {
                    const card = document.createElement('div');
                    card.className = 'hostel-card';
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        window.location.href = `hostel-details.html?id=${hostel.id}`;
                    });

                    // Facilities sub-rendering
                    const facilitiesHtml = hostel.facilities.slice(0, 3).map(f => 
                        `<span class="facility-badge" style="font-size: 10px; padding: 2px 8px;">${f.name}</span>`
                    ).join('');

                    card.innerHTML = `
                        <div class="hostel-img-placeholder"></div>
                        <div class="hostel-info">
                            <h3 class="hostel-name">${hostel.name}</h3>
                            <div class="hostel-location">📍 ${hostel.address}, ${hostel.city}</div>
                            <p class="hostel-desc">${hostel.description || 'No description provided.'}</p>
                            <div class="facilities-container" style="margin-bottom: 15px;">
                                ${facilitiesHtml}
                            </div>
                            <div class="hostel-footer">
                                <span style="color: var(--text-muted); font-size: 13px;">Phone: ${hostel.contactNumber || 'N/A'}</span>
                                <span style="color: var(--primary-color); font-weight: 700; font-size: 14px;">View Details →</span>
                            </div>
                        </div>
                    `;
                    hostelsGrid.appendChild(card);
                });
            } catch (err) {
                hostelsGrid.innerHTML = `<p style="text-align: center; grid-column: 1 / -1; color: var(--danger);">Failed to load hostels: ${err.message}</p>`;
            }
        }

        // Initialize Page
        renderNavbar();
        fetchHostels();

        // Search trigger
        document.getElementById('searchBtn').addEventListener('click', () => {
            const city = document.getElementById('searchCity').value;
            fetchHostels(city);
        });

        document.getElementById('searchCity').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = document.getElementById('searchCity').value;
                fetchHostels(city);
            }
        });
    </script>
</body>
</html>
