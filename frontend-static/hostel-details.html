<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - Hostel Details</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">🏢 HostelHub</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>

    <!-- Details Container -->
    <div id="detailsWrapper" class="details-layout" style="display: none;">
        
        <!-- Main Details (Left Column) -->
        <main class="details-main">
            <div id="galleryContainer" class="gallery-container" style="display: none;"></div>
            <div id="defaultBanner" class="details-banner"></div>
            
            <div class="details-title-row">
                <div>
                    <h1 id="hostelName">Hostel Name</h1>
                    <div id="hostelLocation" class="hostel-location" style="font-size: 16px;">📍 Location</div>
                </div>
            </div>

            <div>
                <h2>Description</h2>
                <p id="hostelDescription" style="color: var(--text-secondary); margin-top: 10px;">Description of the hostel...</p>
            </div>

            <div>
                <h2>📍 Exact Location</h2>
                <div id="mapContainer" style="margin-top: 15px; border-radius: var(--border-radius-lg); overflow: hidden; border: 1px solid var(--border-color); height: 300px; box-shadow: var(--accent-glow);">
                    <!-- Dynamically populated iframe -->
                </div>
            </div>

            <div id="paymentDetailsSection" style="display: none; background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: var(--border-radius-md); border: 1px solid var(--border-color); margin-top: 20px;">
                <h2 style="font-size: 16px; margin-bottom: 8px;">💳 Owner UPI & Bank Account</h2>
                <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;">
                    UPI ID: <strong id="hostelUpiDetails" style="color: var(--primary-color);">N/A</strong><br>
                    Bank Account Details: <strong id="hostelBankDetails">N/A</strong>
                </p>
            </div>

            <div>
                <h2>Facilities Available</h2>
                <div id="hostelFacilities" class="facilities-container">
                    <!-- Dynamic badges -->
                </div>
            </div>

            <div>
                <h2>Available Rooms</h2>
                <div id="roomsContainer" style="margin-top: 15px;">
                    <!-- Dynamic room cards -->
                </div>
            </div>
        </main>

        <!-- Sidebar / Booking Box (Right Column) -->
        <aside class="details-sidebar">
            <div class="booking-card">
                <h3>Request Room Booking</h3>
                <div id="bookingAlert" class="alert-box" style="display: none; margin-top: 15px; margin-bottom: 15px;"></div>
                
                <div id="bookingFormContainer" style="margin-top: 20px;">
                    <!-- Populated based on auth role -->
                </div>
            </div>
        </aside>

    </div>

    <div id="loadingText" style="text-align: center; padding: 100px; color: var(--text-secondary); font-size: 18px;">
        Loading hostel details...
    </div>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostelId = urlParams.get('id');

        if (!hostelId) {
            window.location.href = 'index.html';
        }

        function renderNavbar() {
            const navLinks = document.getElementById('navLinks');
            const user = Api.auth.getCurrentUser();
            
            let links = `<li><a href="index.html">Home</a></li>`;
            
            if (Api.auth.isAuthenticated() && user) {
                if (user.role === 'OWNER') {
                    links += `<li><a href="dashboard.html" class="btn btn-secondary">🛠️ Manage Listings</a></li>`;
                } else {
                    links += `<li><a href="dashboard.html" class="btn btn-secondary">📝 My Bookings</a></li>`;
                }
                links += `<li><span style="color: var(--text-secondary); margin-left: 10px;">Hi, ${user.name}</span></li>`;
                links += `<li><button onclick="Api.auth.logout()" class="btn btn-outline">Log Out</button></li>`;
            } else {
                links += `<li><a href="login.html" class="btn btn-secondary">Log In</a></li>`;
                links += `<li><a href="register.html" class="btn btn-primary">Sign Up</a></li>`;
            }
            
            navLinks.innerHTML = links;
        }

        async function loadHostelDetails() {
            try {
                const data = await Api.hostels.getById(hostelId);
                const hostel = data.hostel;
                const rooms = data.rooms;

                // Update text details
                document.getElementById('hostelName').textContent = hostel.name;
                document.getElementById('hostelLocation').textContent = `📍 ${hostel.address}, ${hostel.city} (Phone: ${hostel.contactNumber || 'N/A'})`;
                document.getElementById('hostelDescription').textContent = hostel.description || 'No description available for this hostel.';

                // Render Map Location
                const mapContainer = document.getElementById('mapContainer');
                const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(hostel.address + ', ' + hostel.city)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                mapContainer.innerHTML = `<iframe width="100%" height="100%" frameborder="0" style="border:0;" allowfullscreen="" loading="lazy" src="${embedUrl}"></iframe>`;

                // Render payment details
                if (hostel.upiId || hostel.bankAccount) {
                    document.getElementById('hostelUpiDetails').textContent = hostel.upiId || 'N/A';
                    document.getElementById('hostelBankDetails').textContent = hostel.bankAccount || 'N/A';
                    document.getElementById('paymentDetailsSection').style.display = 'block';
                } else {
                    document.getElementById('paymentDetailsSection').style.display = 'none';
                }
                
                // Render images
                const galleryContainer = document.getElementById('galleryContainer');
                const defaultBanner = document.getElementById('defaultBanner');
                if (hostel.images && hostel.images.length > 0) {
                    galleryContainer.innerHTML = '';
                    hostel.images.forEach(img => {
                        const imageElement = document.createElement('img');
                        imageElement.className = 'gallery-img';
                        imageElement.src = img.imageUrl;
                        imageElement.alt = hostel.name;
                        imageElement.onerror = () => { imageElement.style.display = 'none'; };
                        galleryContainer.appendChild(imageElement);
                    });
                    galleryContainer.style.display = 'flex';
                    defaultBanner.style.display = 'none';
                } else {
                    galleryContainer.style.display = 'none';
                    defaultBanner.style.display = 'flex';
                }

                // Render facilities
                const facilitiesContainer = document.getElementById('hostelFacilities');
                facilitiesContainer.innerHTML = '';
                if (hostel.facilities && hostel.facilities.length > 0) {
                    hostel.facilities.forEach(fac => {
                        const badge = document.createElement('span');
                        badge.className = 'facility-badge';
                        badge.textContent = fac.name;
                        facilitiesContainer.appendChild(badge);
                    });
                } else {
                    facilitiesContainer.innerHTML = '<span style="color: var(--text-muted);">No custom facilities listed.</span>';
                }

                // Render rooms
                const roomsContainer = document.getElementById('roomsContainer');
                roomsContainer.innerHTML = '';
                if (rooms && rooms.length > 0) {
                    rooms.forEach(room => {
                        const roomCard = document.createElement('div');
                        roomCard.className = 'room-item-card';
                        
                        let statusBadge = '';
                        if (room.status === 'AVAILABLE') {
                            statusBadge = '<span class="status-pill status-available">Available</span>';
                        } else if (room.status === 'OCCUPIED') {
                            statusBadge = '<span class="status-pill status-occupied">Occupied</span>';
                        } else {
                            statusBadge = '<span class="status-pill status-pending">Maintenance</span>';
                        }

                        roomCard.innerHTML = `
                            <div>
                                <h3>Room ${room.roomNumber}</h3>
                                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">
                                    Type: ${room.roomType} | Max Capacity: ${room.capacity} sharing
                                </p>
                                <div style="margin-top: 8px;">${statusBadge}</div>
                            </div>
                            <div class="room-price-info">
                                <div class="room-price">₹${room.pricePerMonth}</div>
                                <span style="font-size: 12px; color: var(--text-muted);">per month</span>
                            </div>
                        `;
                        roomsContainer.appendChild(roomCard);
                    });
                } else {
                    roomsContainer.innerHTML = '<p style="color: var(--text-muted);">No rooms currently listed for this hostel.</p>';
                }

                // Render Booking Sidebar
                renderBookingForm(rooms);

                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('detailsWrapper').style.display = 'grid';

            } catch (err) {
                document.getElementById('loadingText').innerHTML = `<p style="color: var(--danger);">Failed to load details: ${err.message}</p>`;
            }
        }

        function renderBookingForm(rooms) {
            const formContainer = document.getElementById('bookingFormContainer');
            const user = Api.auth.getCurrentUser();

            if (!Api.auth.isAuthenticated()) {
                formContainer.innerHTML = `
                    <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
                        You must log in to submit a room booking request.
                    </p>
                    <a href="login.html" class="btn btn-primary" style="width: 100%; justify-content: center;">Log In to Book</a>
                `;
                return;
            }

            if (user.role === 'OWNER') {
                formContainer.innerHTML = `
                    <div class="alert-box alert-danger" style="margin-top: 0;">
                        Hostel owners cannot request room bookings. Please log in as a student to book a room.
                    </div>
                `;
                return;
            }

            // Student booking form
            const availableRooms = rooms.filter(r => r.status === 'AVAILABLE');

            if (availableRooms.length === 0) {
                formContainer.innerHTML = `
                    <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; font-weight: 500;">
                        No rooms are currently available in this hostel.
                    </p>
                    <button class="btn btn-secondary" style="width: 100%;" disabled>Fully Booked</button>
                `;
                return;
            }

            let roomOptions = '';
            availableRooms.forEach(room => {
                roomOptions += `<option value="${room.id}">Room ${room.roomNumber} - ${room.roomType} (₹${room.pricePerMonth}/mo)</option>`;
            });

            formContainer.innerHTML = `
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="roomSelect">Select Room</label>
                        <select id="roomSelect" class="form-control form-select" required>
                            ${roomOptions}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 15px;">
                        Request Booking
                    </button>
                </form>
            `;

            // Set default date limits (today as min start date)
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').min = today;
            document.getElementById('endDate').min = today;

            // Submit listener
            document.getElementById('bookingForm').addEventListener('submit', handleBookingSubmit);
        }

        async function handleBookingSubmit(e) {
            e.preventDefault();
            const alertBox = document.getElementById('bookingAlert');
            const roomId = document.getElementById('roomSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // Validation: end date must be after start date
            if (new Date(endDate) <= new Date(startDate)) {
                alertBox.className = 'alert-box alert-danger';
                alertBox.textContent = 'End Date must be after the Start Date.';
                alertBox.style.display = 'flex';
                return;
            }

            try {
                const response = await Api.bookings.create({
                    roomId: parseInt(roomId),
                    startDate,
                    endDate
                });

                alertBox.className = 'alert-box alert-success';
                alertBox.textContent = 'Booking request submitted successfully! You can track approval status on your dashboard.';
                alertBox.style.display = 'flex';

                // Reload layout details to show updated room list (room status) after a small delay
                setTimeout(() => {
                    alertBox.style.display = 'none';
                    loadHostelDetails();
                }, 4000);

            } catch (err) {
                alertBox.className = 'alert-box alert-danger';
                alertBox.textContent = err.message || 'Failed to submit booking request.';
                alertBox.style.display = 'flex';
            }
        }

        // Initialize
        renderNavbar();
        loadHostelDetails();
    </script>
</body>
</html>
